<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · ERC 管理</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
    @media (max-width: 920px) { .stats-row { grid-template-columns: 1fr; } }

    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toolbar .spacer { flex: 1; }

    .toggle-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border-soft);
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      background: var(--surface); color: var(--muted);
    }
    .toggle-btn.published { background: #dcfce7; border-color: #86efac; color: #166534; }
    .toggle-btn.unpublished { background: var(--surface); border-color: var(--border-soft); color: var(--muted); }
    .toggle-btn:hover { opacity: 0.85; }

    .toggle-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: currentColor;
    }

    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 12px; padding: 24px; max-width: 640px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-box h3 { margin: 0 0 16px; font-size: 18px; }
    .modal-box pre {
      background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; overflow-x: auto; white-space: pre;
    }
    .modal-box .modal-actions { display: flex; justify-content: flex-end; margin-top: 16px; }

    .file-input-wrap { position: relative; display: inline-block; }
    .file-input-wrap input[type="file"] { display: none; }
  </style>
</head>

        <tr>

          <th>文章数</th>
          <th>做题人数</th>
          <th>上架状态</th>
        </tr>
      </thead>
      <tbody data-erc-sets></tbody>
    </table>
  </div>

</main>

<script src="js/api.js"></script>

<script src="js/apps.js"></script>
<script>
// Remove clickable links from reading set table (post-process after apps.js renders)
(function patchSetLinks() {
  const tbody = document.querySelector('[data-erc-sets]');
  if (!tbody) { setTimeout(patchSetLinks, 200); return; }
  const check = () => {
    tbody.querySelectorAll('td:first-child a').forEach(a => {
      const span = document.createElement('span');
      span.style.fontWeight = '500';
      span.style.color = 'var(--fg)';
      span.textContent = a.textContent;
      a.replaceWith(span);
    });
  };
  check();
  // Observe for changes
  const observer = new MutationObserver(() => { check(); });
  observer.observe(tbody, { childList: true, subtree: true });
})();
</script>
</body>
