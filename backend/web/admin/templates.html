<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · 模板商店</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .template-card { display: flex; flex-direction: column; height: 100%; transition: all 0.2s ease; }
    .template-card:hover { border-color: var(--accent); box-shadow: var(--elev-raised); }
    .template-card .tag { margin-bottom: 12px; }
    .template-card .desc { font-size: 14px; color: var(--muted); margin: 12px 0; flex-grow: 1; line-height: 1.6; }
    .template-card .footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; }

  </style>
</head>
<body>

<aside class="sidebar">
  <div style="margin-bottom: 40px;">
    <h1 style="font-size: 24px; color: var(--accent); margin: 0;">Ark Admin</h1>
  </div>

  <div class="nav-group">
    <span class="nav-label">主看板</span>
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      用户概览
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">子应用</span>
    <a href="apps.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      子应用
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">功能</span>
    <a href="users.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      用户管理
    </a>
    <a href="templates.html" class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      模板商店
    </a>
  </div>

  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-soft);">
    <a href="/" class="nav-item" style="font-size: 13px;">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      返回主应用
    </a>
  </div>
</aside>

<main class="main-content" data-od-id="main">
  <header style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
      <h2 style="font-size: 32px; margin: 0;">模板商店</h2>
      <p style="color: var(--muted); margin: 4px 0 0;">管理及分发内容模板。</p>
    </div>
    <button class="btn btn-primary">+ 新建模板</button>
  </header>

  <div class="template-grid">
    <div class="admin-card template-card">
      <span class="pill" style="align-self: flex-start; background: #e8f5e9; color: #2e7d32;">考研</span>
      <h3 style="margin: 0; font-size: 20px;">考研英语</h3>
      <p class="desc">针对研究生入学考试英语科目的专项优化模板，包含阅读理解、长难句翻译及核心词汇自测。</p>
      <div class="footer">
        <span style="font-size: 12px; color: var(--muted); font-family: var(--font-mono);">关联项数: 156</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn-ghost" style="padding: 4px; font-size: 12px;">编辑</button>
          <button class="btn-ghost" style="padding: 4px; font-size: 12px; color: var(--danger);">删除</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
