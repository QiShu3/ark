<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · 用户管理</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .filter-bar { display: flex; gap: 16px; margin-bottom: 24px; align-items: center; }
    .search-input { flex: 1; padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); font-size: 14px; }
    .search-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
    
    .pill.active { background: #e6f4ea; color: #1e7e34; }
    .pill.banned { background: #fce8e6; color: #d93025; }

  </style>
</head>
<body>

<aside class="sidebar">
  <div style="margin-bottom: 40px;">
    <h1 style="font-size: 24px; color: var(--accent); margin: 0;">Ark Admin</h1>
  </div>

  <div class="nav-group">
    <span class="nav-label">主看板</span>
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      用户概览
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">子应用</span>
    <a href="apps.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      子应用
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">功能</span>
    <a href="users.html" class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      用户管理
    </a>
    <a href="templates.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      事件模板
    </a>
  </div>

  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-soft);">
    <a href="/" class="nav-item" style="font-size: 13px;">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      返回主应用
    </a>
  </div>
</aside>

<main class="main-content" data-od-id="main">
  <header style="margin-bottom: 40px;">
    <h2 style="font-size: 32px; margin: 0;">用户管理</h2>
    <p style="color: var(--muted); margin: 4px 0 0;">查看、编辑及审核系统用户。</p>
  </header>

  <form id="user-search-form" class="filter-bar">
    <input type="text" id="user-search-input" class="search-input" placeholder="搜索用户名、邮箱或 ID..." />
    <select id="user-status-filter" class="btn btn-secondary" style="height: 42px;">
      <option value="all">所有状态</option>
      <option value="active">启用</option>
      <option value="disabled">禁用</option>
    </select>
    <button type="submit" class="btn btn-primary">搜索</button>
  </form>

  <div class="admin-card" style="padding: 0; overflow-x: auto;">
    <table class="admin-table" style="border: 0; border-radius: 0;">
      <thead>
        <tr>
          <th>ID</th>
          <th>用户</th>
          <th>验证状态</th>
          <th>管理员</th>
          <th>状态</th>
          <th>注册时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="user-table-body"></tbody>
    </table>
  </div>
  
  <div id="pagination" style="margin-top: 24px; display: flex; justify-content: center; align-items: center; gap: 8px;"></div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/users.js"></script>
</body>
</html>
