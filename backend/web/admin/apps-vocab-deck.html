<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · 词书详情</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .deck-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .deck-header h2 { margin: 0; font-size: 28px; }
    .deck-meta { display: flex; gap: 16px; font-size: 14px; color: var(--muted); }
    .deck-meta span { display: inline-flex; align-items: center; gap: 4px; }

    .search-bar { margin-bottom: 16px; }
    .search-bar input {
      width: 100%; max-width: 400px; padding: 8px 12px;
      border: 1px solid var(--border-soft); border-radius: 8px;
      font-size: 14px; background: var(--surface); color: var(--text);
      outline: none; transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: var(--accent); }

    .word-row-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .pronunciation { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .translation-tag {
      display: inline-block; padding: 1px 8px; margin: 2px 4px 2px 0;
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 4px; font-size: 12px;
    }
    .pos-tag {
      display: inline-block; padding: 0 6px; margin-right: 4px;
      background: var(--accent-bg, #e8f0fe); color: var(--accent);
      border-radius: 3px; font-size: 11px; font-weight: 500;
    }

    .word-count-badge {
      display: inline-block; padding: 2px 10px;
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 12px; font-size: 13px; color: var(--muted);
      font-family: var(--font-mono);
    }

    .sentence-container {
      margin: 4px 0; padding: 4px 10px;
      background: rgba(0,0,0,0.02); border-left: 3px solid var(--accent);
      border-radius: 4px; font-size: 12px;
    }
    .sentence-en { font-family: var(--font-sans); color: var(--text); font-weight: 500; }
    .sentence-zh { color: var(--muted); margin-top: 2px; }

    .pagination-bar {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 0; padding: 16px 24px;
      background: var(--surface); border-top: 1px solid var(--border-soft);
      border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
      font-size: 13px;
    }
    .pagination-btn {
      padding: 6px 12px; border: 1px solid var(--border-soft);
      background: var(--surface); color: var(--text); border-radius: 6px;
      cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .pagination-btn:hover:not(:disabled) {
      border-color: var(--accent); background: var(--accent-bg); color: var(--accent);
    }
    .pagination-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .pagination-btn:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    .pagination-info {
      margin: 0 16px; color: var(--muted);
    }

    .empty-state { text-align: center; padding: 40px; color: var(--muted); }

    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toolbar .spacer { flex: 1; }

    .btn-danger { background: #dc2626; color: #fff; border: none; }
    .btn-danger:hover { background: #b91c1c; }

    .confirm-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
    }
    .confirm-overlay.active { display: flex; }
    .confirm-box {
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 12px; padding: 24px; max-width: 420px; width: 90%;
    }
    .confirm-box h3 { margin: 0 0 12px; font-size: 18px; }
    .confirm-box p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .confirm-box .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .file-input-wrap { position: relative; display: inline-block; }
    .file-input-wrap input[type="file"] { display: none; }
  </style>
</head>

  </div>

  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-soft);">
    <a href="/" class="nav-item" style="font-size: 13px;">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>

    </a>
  </div>

<main class="main-content">
  <nav class="breadcrumb">
    <a href="apps.html">子应用</a>
    <span>/</span>
    <a href="apps-vocab.html">词汇管理</a>
    <span>/</span>
    <span id="deck-breadcrumb">词书详情</span>
  </nav>

  <div class="deck-header">
    <h2 id="deck-name">加载中...</h2>
    <span class="word-count-badge" id="deck-word-count">—</span>
  </div>
  <p id="deck-description" style="color: var(--muted); margin: 0 0 24px;"></p>

  <div class="toolbar">
    <div class="file-input-wrap">
      <button class="btn btn-secondary" id="btn-update" type="button">更新词书</button>
      <input type="file" id="file-update" accept=".json" />
    </div>
    <div class="spacer"></div>
    <button class="btn btn-danger" id="btn-delete" type="button">删除词书</button>
  </div>

  <div class="search-bar">
    <input type="text" id="word-search" placeholder="搜索单词..." />
  </div>

  <!-- Delete Confirmation -->
  <div class="confirm-overlay" id="confirm-delete">
    <div class="confirm-box">
      <h3>确认删除</h3>
      <p>确定要删除词书 <strong id="confirm-deck-name"></strong> 吗？此操作不可撤销，所有单词数据将被永久删除。</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirm-cancel" type="button">取消</button>
        <button class="btn btn-danger" id="confirm-ok" type="button">确认删除</button>
      </div>
    </div>
  </div>

  <div class="admin-card" style="padding: 0; overflow: hidden; margin-bottom: 24px;">
    <table class="admin-table" style="border: 0; border-radius: 0;">
      <thead>
        <tr>
          <th style="width: 40px;">#</th>
          <th>单词</th>
          <th>音标</th>
          <th style="width: 35%;">释义</th>
          <th>例句</th>
        </tr>
      </thead>
      <tbody id="words-tbody"></tbody>
    </table>
    <div class="pagination-bar" id="pagination-controls"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/apps.js"></script>
