<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · 词汇管理</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
    @media (max-width: 920px) { .stats-row { grid-template-columns: 1fr; } }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toolbar .spacer { flex: 1; }
    .link-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .link-row select, .link-row button { padding: 8px 14px; border-radius: 6px; font-size: 14px; }
    .link-row select { border: 1px solid var(--border); background: var(--surface); min-width: 240px; }
  </style>
</head>
<body>

    <h1 style="font-size: 24px; color: var(--accent); margin: 0;">Ark Admin</h1>
  </div>

  <div class="nav-group">
    <span class="nav-label">主看板</span>
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      用户概览
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">子应用</span>
    <a href="apps.html" class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      子应用
    </a>
    <a href="content-banks.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      题库管理
    </a>

  <div class="nav-group">
    <span class="nav-label">功能</span>
    <a href="users.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      用户管理
    </a>
    <a href="templates.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>

  </div>

    </a>

<main class="main-content">
  <nav class="breadcrumb">
    <a href="apps.html">子应用</a>
    <span>/</span>
    <span>词汇管理</span>
  </nav>

  <header style="margin-bottom: 32px;">
    <h2 style="font-size: 32px; margin: 0;">词汇管理</h2>
    <p style="color: var(--muted); margin: 4px 0 0;">关联并管理词汇题库。</p>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="label">已关联词库</div>
      <div class="val" data-stat="linked">—</div>
    </div>
    <div class="stat-card">
      <div class="label">总词条数</div>
      <div class="val" data-stat="total_words">—</div>
    </div>
    <div class="stat-card">
      <div class="label">可关联词库</div>
      <div class="val" data-stat="unlinked">—</div>
    </div>
  </div>

  <!-- Link bank -->
  <div class="link-row">
    <label style="font-weight:500;white-space:nowrap;">关联题库：</label>
    <select id="link-select">
      <option value="">选择要关联的词库...</option>
    </select>
    <button class="btn btn-primary" id="btn-link" style="font-size:13px;padding:8px 16px;">关联</button>
    <a href="apps-vocab-logs.html" class="btn btn-secondary" style="text-decoration:none;margin-left:auto;">导入日志</a>
  </div>

  <div class="admin-card" style="padding: 0; overflow: hidden;">
    <table class="admin-table" style="border: 0; border-radius: 0;">
      <thead>
        <tr>
          <th>词库名称</th>
          <th>词条数</th>
          <th>上架状态</th>
          <th style="width:80px;">操作</th>
        </tr>
      </thead>
      <tbody data-banks-tbody>
        <tr><td colspan="4" style="text-align:center;color:var(--muted);padding:40px;">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!initPage()) return;
  loadPage();
});

const ITEM_TYPE = 'word';
const FW_TYPES = ['vocab_today'];

let _linked = [];
let _unlinked = [];

async function loadPage() {
  try {
    const allBanks = await api.get('/content-banks?type=' + ITEM_TYPE);
    _linked = allBanks.filter(b => FW_TYPES.includes(b.fw_type));
    _unlinked = allBanks.filter(b => !FW_TYPES.includes(b.fw_type));

    document.querySelector('[data-stat="linked"]').textContent = _linked.length;
    document.querySelector('[data-stat="total_words"]').textContent =
      _linked.reduce((sum, b) => sum + b.item_count, 0).toLocaleString();
    document.querySelector('[data-stat="unlinked"]').textContent = _unlinked.length;

    renderBanks();
    renderLinkSelect();
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

function renderBanks() {
  const tbody = document.querySelector('[data-banks-tbody]');
  if (!_linked.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:40px;">暂无关联网库，请从上方下拉菜单中关联</td></tr>';
    return;
  }

  tbody.innerHTML = _linked.map(b => {
    const pubCls = b.is_published ? 'published' : 'unpublished';
    const pubLabel = b.is_published ? '已上架' : '未上架';
    return '<tr>' +
      '<td style="font-weight:500;">' + b.name + '</td>' +
      '<td style="font-family:var(--font-mono);">' + b.item_count.toLocaleString() + '</td>' +
      '<td><button class="toggle-btn ' + pubCls + '" data-bank-id="' + b.id + '" data-action="toggle-publish"><span class="toggle-dot"></span>' + pubLabel + '</button></td>' +
      '<td><button class="btn btn-secondary" style="padding:4px 8px;font-size:11px;" data-bank-id="' + b.id + '" data-action="unlink">取消关联</button></td>' +
      '</tr>';
  }).join('');

  tbody.querySelectorAll('[data-action="toggle-publish"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const result = await api.patch('/content-banks/' + btn.dataset.bankId + '/publish');
        const pub = result.is_published;
        btn.className = 'toggle-btn ' + (pub ? 'published' : 'unpublished');
        btn.innerHTML = '<span class="toggle-dot"></span>' + (pub ? '已上架' : '未上架');
        showToast(pub ? '已上架' : '已下架', 'success');
      } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
      } finally { btn.disabled = false; }
    });
  });

  tbody.querySelectorAll('[data-action="unlink"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await api.patch('/content-banks/' + btn.dataset.bankId, { fw_type: '' });
        showToast('已取消关联', 'success');
        loadPage();
      } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
      }
    });
  });
}

function renderLinkSelect() {
  const sel = document.getElementById('link-select');
  sel.innerHTML = '<option value="">选择要关联的词库...</option>' +
    _unlinked.map(b => '<option value="' + b.id + '">' + b.name + ' (' + b.item_count.toLocaleString() + ' 词)</option>').join('');
}

document.getElementById('btn-link').addEventListener('click', async () => {
  const sel = document.getElementById('link-select');
  const bankId = sel.value;
  if (!bankId) { showToast('请选择词库', 'error'); return; }
  try {
    await api.patch('/content-banks/' + bankId, { fw_type: FW_TYPES[0] });
    showToast('已关联', 'success');
    loadPage();
  } catch (e) {
    showToast('关联失败: ' + e.message, 'error');
  }
});
</script>
</body>
</html>
