<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · 导入日志</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .log-container {
      background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px;
      font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
      max-height: 70vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }
    .log-line { margin: 0; padding: 1px 0; }
    .log-line.level-ERROR { color: #f48771; }
    .log-line.level-WARNING { color: #cca700; }
    .log-line.level-INFO { color: #d4d4d4; }

    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toolbar .spacer { flex: 1; }
    .log-count { font-size: 13px; color: var(--muted); }

    .empty-state { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

  </div>

  <div class="nav-group">
    <span class="nav-label">主看板</span>
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      用户概览
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">子应用</span>
    <a href="apps.html" class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>

  <div class="nav-group">
    <span class="nav-label">功能</span>
    <a href="users.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>

    <a href="templates.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      模板商店

  </div>

  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-soft);">

    </a>

<main class="main-content">
  <nav class="breadcrumb">
    <a href="apps.html">子应用</a>
    <span>/</span>
    <a href="apps-vocab.html">词汇管理</a>
    <span>/</span>
    <span>导入日志</span>
  </nav>

  <header style="margin-bottom: 24px;">
    <h2 style="font-size: 28px; margin: 0;">导入日志</h2>
    <p style="color: var(--muted); margin: 4px 0 0;">查看词书导入的操作记录和错误信息。</p>
  </header>

  <div class="toolbar">
    <span class="log-count" id="log-count">—</span>
    <div class="spacer"></div>
    <button class="btn btn-secondary" id="btn-refresh" type="button">刷新</button>
  </div>

  <div id="log-container" class="log-container">
    <div class="empty-state">加载中...</div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!initPage()) return;
  loadLogs();

  document.getElementById('btn-refresh')?.addEventListener('click', loadLogs);
});

async function loadLogs() {
  const container = document.getElementById('log-container');
  const countEl = document.getElementById('log-count');
  try {
    const data = await api.get('/apps/vocab/logs');
    if (!data.lines.length) {
      container.innerHTML = '<div class="empty-state">暂无日志</div>';
      countEl.textContent = '0 条';
      return;
    }
    countEl.textContent = `${data.lines.length} 条`;
    container.innerHTML = data.lines.map(line => {
      let cls = '';
      if (line.includes('[ERROR]')) cls = 'level-ERROR';
      else if (line.includes('[WARNING]')) cls = 'level-WARNING';
      else cls = 'level-INFO';
      return `<p class="log-line ${cls}">${escapeHtml(line)}</p>`;
    }).join('');
  } catch (e) {
    container.innerHTML = `<div class="empty-state" style="color:#f48771;">加载失败: ${e.message}</div>`;
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
