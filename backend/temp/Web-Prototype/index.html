<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ark Admin · 用户概览</title>
  <link rel="stylesheet" href="css/common.css" />
  <style>
    /* 页面特定样式 */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
    .focus-section { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
    @media (max-width: 920px) {
      .stat-grid, .focus-section { grid-template-columns: 1fr; }
    }
    
    .nav-group { margin-bottom: 32px; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div style="margin-bottom: 40px;">
    <h1 style="font-size: 24px; color: var(--accent); margin: 0;">Ark Admin</h1>
  </div>

  <div class="nav-group">
    <span class="nav-label">主看板</span>
    <a href="index.html" class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      用户概览
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">子应用</span>
    <a href="apps.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      子应用
    </a>
  </div>

  <div class="nav-group">
    <span class="nav-label">功能</span>
    <a href="users.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      用户管理
    </a>
    <a href="templates.html" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      模板商店
    </a>
  </div>

  <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-soft);">
    <a href="/" class="nav-item" style="font-size: 13px;">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      返回主应用
    </a>
  </div>
</aside>

<main class="main-content">
  <header style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
      <h2 style="font-size: 32px; margin: 0;">用户概览</h2>
      <p style="color: var(--muted); margin: 4px 0 0;">欢迎回来。这是 Ark 的最新运行概览。</p>
    </div>
    <div style="display: flex; gap: 12px;">
      <button class="btn btn-secondary" style="padding: 8px 16px; font-size: 13px;">导出报告</button>
      <button class="btn btn-primary" style="padding: 8px 16px; font-size: 13px;">刷新数据</button>
    </div>
  </header>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="label">总用户数</div>
      <div class="val">12,840</div>
      <div class="trend up">↑ 较上月增长 12%</div>
    </div>
    <div class="stat-card">
      <div class="label">今日新增</div>
      <div class="val">142</div>
      <div class="trend up">↑ 较昨日增长 8%</div>
    </div>
    <div class="stat-card">
      <div class="label">邮箱验证率</div>
      <div class="val">94.2%</div>
      <div class="trend">保持稳定</div>
    </div>
    <div class="stat-card">
      <div class="label">7日活跃用户</div>
      <div class="val">4,210</div>
      <div class="trend up">↑ 增长 3.4%</div>
    </div>
  </div>

  <div class="focus-section">
    <div class="admin-card">
      <h3 style="margin-top: 0; margin-bottom: 24px;">签到与专注</h3>
      
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border-soft);">
        <div>
          <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">今日签到率</div>
          <div style="font-size: 24px; font-weight: 600; color: var(--accent);">68%</div>
        </div>
        <div>
          <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">今日总专注时长</div>
          <div style="font-size: 24px; font-weight: 600; color: var(--accent);">1,420h</div>
        </div>
        <div>
          <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">人均专注时长</div>
          <div style="font-size: 24px; font-weight: 600; color: var(--accent);">42m</div>
        </div>
      </div>

      <div style="margin-top: 24px;">
        <h4 style="font-size: 14px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px;">近7天趋势</h4>
        <div style="height: 120px; display: flex; align-items: flex-end; gap: 8px;">
          <div style="flex: 1; background: var(--accent-soft); height: 40%; border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; background: var(--accent-soft); height: 65%; border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; background: var(--accent-soft); height: 50%; border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; background: var(--accent-soft); height: 85%; border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; background: var(--accent-soft); height: 70%; border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; background: var(--accent-soft); height: 95%; border-radius: 4px 4px 0 0;"></div>
          <div style="flex: 1; background: var(--accent); height: 100%; border-radius: 4px 4px 0 0;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: var(--muted); font-family: var(--font-mono);">
          <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h3 style="margin-top: 0; margin-bottom: 24px;">连续签到 Top 5</h3>
      <div class="stack" style="gap: 12px; display: flex; flex-direction: column;">
        <div class="list-item">
          <div class="row">
            <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--surface-warm); display: grid; place-items: center; font-size: 12px; font-weight: 600;">1</div>
            <span style="font-size: 14px;">陈伟</span>
          </div>
          <span class="pill">42 天</span>
        </div>
        <div class="list-item">
          <div class="row">
            <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--surface-warm); display: grid; place-items: center; font-size: 12px;">2</div>
            <span style="font-size: 14px;">李娜</span>
          </div>
          <span class="pill">38 天</span>
        </div>
        <div class="list-item">
          <div class="row">
            <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--surface-warm); display: grid; place-items: center; font-size: 12px;">3</div>
            <span style="font-size: 14px;">张齐</span>
          </div>
          <span class="pill">35 天</span>
        </div>
        <div class="list-item">
          <div class="row">
            <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--surface-warm); display: grid; place-items: center; font-size: 12px;">4</div>
            <span style="font-size: 14px;">王波</span>
          </div>
          <span class="pill">31 天</span>
        </div>
        <div class="list-item">
          <div class="row">
            <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--surface-warm); display: grid; place-items: center; font-size: 12px;">5</div>
            <span style="font-size: 14px;">刘洋</span>
          </div>
          <span class="pill">29 天</span>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
