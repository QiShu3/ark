<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习路径 Fork 树状图</title>
    <style id="theme-vars">
:root {
  /* === Brand Color System === */
  --color-primary: #4F7DF7;
  --color-primary-light: #7B9EFF;
  --color-primary-lighter: #E8EEFF;
  --color-primary-dark: #3A5FCC;
  --color-primary-bg: #F0F4FF;

  /* === State Colors === */
  --state-success: #34C77B;
  --state-success-bg: #E8FAF0;
  --state-warning: #F5A623;
  --state-warning-bg: #FFF8EB;
  --state-error: #F25C5C;
  --state-error-bg: #FFF0F0;
  --state-info: #4F7DF7;

  /* === Neutral Colors === */
  --color-bg: #F7F8FC;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #EEF0F5;
  --color-text-primary: #1D2137;
  --color-text-secondary: #6B7394;
  --color-text-tertiary: #9AA0B9;
  --color-border: #E3E6F0;
  --color-border-light: #F0F1F5;

  /* === Surface & Depth === */
  --surface-card: #FFFFFF;
  --surface-card-border: #E8EBF4;
  --surface-card-shadow: rgba(79, 125, 247, 0.04);
  --surface-float-shadow: rgba(30, 41, 59, 0.12);

  /* === Fork Path Colors === */
  --path-main: #4F7DF7;
  --path-fork: #9B7FE6;
  --path-return: #F5A623;
  --path-success: #34C77B;
  --path-node-bg: #FFFFFF;
  --path-node-active: #F0F4FF;

  /* === Typography === */
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Radius === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family); background: var(--color-bg);">
    <main class="flex items-start justify-center py-12 px-4 md:py-16">
      <div class="w-full" style="max-width: 800px;">

        <!-- Card -->
        <div style="background: var(--surface-card); border: 1px solid var(--surface-card-border); border-radius: var(--radius-lg); padding: var(--space-8); box-shadow: 0 1px 2px rgba(15,23,42,0.05);">

          <!-- Header -->
          <div class="flex items-center gap-3 mb-2">
            <span style="background: var(--state-success-bg); color: var(--state-success); font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); padding: 2px 10px; border-radius: var(--radius-full); letter-spacing: 0.03em;">WORKFLOW COMPLETE</span>
          </div>
          <h1 style="font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--color-text-primary); margin: 0 0 var(--space-1) 0; line-height: var(--line-height-tight); text-wrap: balance; word-break: keep-all;">工作流完成</h1>
          <p style="font-size: var(--font-size-md); color: var(--color-text-secondary); margin: 0 0 var(--space-6) 0;">英语二阅读 &rarr; 目标正确率 80%</p>

          <!-- Stat Cards Row -->
          <div class="grid grid-cols-4 gap-3 mb-8">
            <!-- Focus Time -->
            <div style="background: var(--color-bg); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);">
              <div class="flex items-center gap-1.5 mb-1">
                <i data-lucide="clock" style="width:14px; height:14px; color: var(--color-text-tertiary);"></i>
                <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">专注时长</span>
              </div>
              <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">42min</span>
            </div>
            <!-- Tasks Done -->
            <div style="background: var(--color-bg); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);">
              <div class="flex items-center gap-1.5 mb-1">
                <i data-lucide="check-circle" style="width:14px; height:14px; color: var(--color-text-tertiary);"></i>
                <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">完成任务</span>
              </div>
              <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">5</span>
            </div>
            <!-- Extended Learning -->
            <div style="background: var(--color-bg); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);">
              <div class="flex items-center gap-1.5 mb-1">
                <i data-lucide="git-branch" style="width:14px; height:14px; color: var(--color-text-tertiary);"></i>
                <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">拓展学习</span>
              </div>
              <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">2</span>
            </div>
            <!-- Best Accuracy -->
            <div style="background: var(--color-bg); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);">
              <div class="flex items-center gap-1.5 mb-1">
                <i data-lucide="target" style="width:14px; height:14px; color: var(--color-text-tertiary);"></i>
                <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">最佳正确率</span>
              </div>
              <span style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--state-success);">83%</span>
            </div>
          </div>

          <!-- SVG Tree Diagram -->
          <div class="fork-tree-container" style="width: 100%; overflow-x: auto;">
            <svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; min-width: 520px; display: block;">
              <defs>
                <!-- Arrowhead markers -->
                <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                  <path d="M0,0 L8,3 L0,6 Z" fill="var(--path-main)"/>
                </marker>
                <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                  <path d="M0,0 L8,3 L0,6 Z" fill="var(--path-return)"/>
                </marker>
                <marker id="arrow-purple" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
                  <path d="M0,0 L7,2.5 L0,5 Z" fill="var(--path-fork)"/>
                </marker>
                <!-- Return arrow icon marker -->
                <marker id="arrow-return" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
                  <path d="M0,0 L10,4 L0,8 Z" fill="var(--path-return)"/>
                </marker>
              </defs>

              <!-- ============ MAIN VERTICAL PATH (blue solid line) ============ -->
              <line x1="155" y1="60" x2="155" y2="108" stroke="var(--path-main)" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
              <line x1="155" y1="178" x2="155" y2="248" stroke="var(--path-main)" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
              <line x1="155" y1="318" x2="155" y2="388" stroke="var(--path-main)" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

              <!-- ============ ROUND LABELS ============ -->
              <text x="38" y="128" font-family="var(--font-family)" font-size="11" font-weight="600" fill="var(--color-text-tertiary)" text-anchor="middle">第 1 轮</text>
              <text x="38" y="268" font-family="var(--font-family)" font-size="11" font-weight="600" fill="var(--color-text-tertiary)" text-anchor="middle">第 2 轮</text>
              <text x="38" y="408" font-family="var(--font-family)" font-size="11" font-weight="600" fill="var(--color-text-tertiary)" text-anchor="middle">第 3 轮</text>

              <!-- ============ ROUND 1 NODES ============ -->
              <!-- Main node: 阅读理解 (Round 1) - FAIL 45% -->
              <g class="tree-node">
                <rect x="78" y="110" width="154" height="66" rx="10" fill="var(--path-node-bg)" stroke="var(--path-main)" stroke-width="1.5"/>
                <!-- Blue left accent bar -->
                <rect x="78" y="110" width="5" height="66" rx="2.5" fill="var(--path-main)"/>
                <!-- Icon circle -->
                <circle cx="100" cy="128" r="10" fill="var(--color-primary-bg)"/>
                <text x="100" y="132" font-family="var(--font-family)" font-size="11" font-weight="600" fill="var(--color-primary)" text-anchor="middle">R</text>
                <!-- Node name -->
                <text x="115" y="132" font-family="var(--font-family)" font-size="13" font-weight="600" fill="var(--color-text-primary)">阅读理解</text>
                <!-- Accuracy badge -->
                <rect x="94" y="140" width="48" height="20" rx="10" fill="var(--state-error-bg)"/>
                <text x="118" y="154" font-family="var(--font-family)" font-size="10" font-weight="600" fill="var(--state-error)" text-anchor="middle">45%</text>
                <!-- FAIL badge -->
                <rect x="148" y="140" width="56" height="20" rx="10" fill="var(--state-error-bg)"/>
                <text x="176" y="154" font-family="var(--font-family)" font-size="10" font-weight="600" fill="var(--state-error)" text-anchor="middle">未达标</text>
              </g>

              <!-- Fork label -->
              <text x="248" y="125" font-family="var(--font-family)" font-size="11" font-weight="500" fill="var(--path-fork)">Fork</text>
              <line x1="234" y1="130" x2="282" y2="130" stroke="var(--path-fork)" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

              <!-- Fork branch lines (Round 1) -->
              <!-- To 背单词 (chosen) -->
              <path d="M260,143 C300,143 310,148 340,148" stroke="var(--path-fork)" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>
              <!-- To 长难句剖析 (grayed) -->
              <path d="M260,143 C300,143 310,178 340,178" stroke="var(--color-border)" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
              <!-- To 题意理解 (grayed) -->
              <path d="M260,143 C300,143 310,208 340,208" stroke="var(--color-border)" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>

              <!-- Branch node: 背单词 (chosen, completed) -->
              <g class="tree-node">
                <rect x="342" y="132" width="120" height="34" rx="8" fill="var(--path-node-active)" stroke="var(--path-fork)" stroke-width="1.5"/>
                <!-- Checkmark -->
                <circle cx="362" cy="149" r="9" fill="var(--state-success)"/>
                <path d="M358,149 L361,152 L367,146" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="378" y="153" font-family="var(--font-family)" font-size="12" font-weight="600" fill="var(--color-text-primary)">背单词</text>
              </g>

              <!-- Branch node: 长难句剖析 (not chosen) -->
              <g class="tree-node" opacity="0.4">
                <rect x="342" y="162" width="120" height="34" rx="8" fill="var(--color-bg)" stroke="var(--color-border)" stroke-width="1"/>
                <text x="402" y="183" font-family="var(--font-family)" font-size="12" font-weight="500" fill="var(--color-text-tertiary)" text-anchor="middle">长难句剖析</text>
              </g>

              <!-- Branch node: 题意理解 (not chosen) -->
              <g class="tree-node" opacity="0.4">
                <rect x="342" y="192" width="120" height="34" rx="8" fill="var(--color-bg)" stroke="var(--color-border)" stroke-width="1"/>
                <text x="402" y="213" font-family="var(--font-family)" font-size="12" font-weight="500" fill="var(--color-text-tertiary)" text-anchor="middle">题意理解</text>
              </g>

              <!-- Return arrow from 背单词 to Round 2 main node -->
              <path d="M402,166 C402,210 260,220 175,250" stroke="var(--path-return)" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
              <!-- Return icon label -->
              <g transform="translate(298,210)">
                <rect x="0" y="0" width="36" height="16" rx="4" fill="var(--state-warning-bg)"/>
                <text x="18" y="12" font-family="var(--font-family)" font-size="9" font-weight="600" fill="var(--path-return)" text-anchor="middle">回归</text>
              </g>

              <!-- ============ ROUND 2 NODES ============ -->
              <!-- Main node: 阅读理解 (Round 2) - FAIL 62% -->
              <g class="tree-node">
                <rect x="78" y="250" width="154" height="66" rx="10" fill="var(--path-node-bg)" stroke="var(--path-main)" stroke-width="1.5"/>
                <rect x="78" y="250" width="5" height="66" rx="2.5" fill="var(--path-main)"/>
                <circle cx="100" cy="268" r="10" fill="var(--color-primary-bg)"/>
                <text x="100" y="272" font-family="var(--font-family)" font-size="11" font-weight="600" fill="var(--color-primary)" text-anchor="middle">R</text>
                <text x="115" y="272" font-family="var(--font-family)" font-size="13" font-weight="600" fill="var(--color-text-primary)">阅读理解</text>
                <rect x="94" y="280" width="48" height="20" rx="10" fill="var(--state-warning-bg)"/>
                <text x="118" y="294" font-family="var(--font-family)" font-size="10" font-weight="600" fill="var(--state-warning)" text-anchor="middle">62%</text>
                <rect x="148" y="280" width="56" height="20" rx="10" fill="var(--state-error-bg)"/>
                <text x="176" y="294" font-family="var(--font-family)" font-size="10" font-weight="600" fill="var(--state-error)" text-anchor="middle">未达标</text>
              </g>

              <!-- Fork label -->
              <text x="248" y="265" font-family="var(--font-family)" font-size="11" font-weight="500" fill="var(--path-fork)">Fork</text>
              <line x1="234" y1="270" x2="282" y2="270" stroke="var(--path-fork)" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

              <!-- Fork branch lines (Round 2) -->
              <!-- To 背单词 (already done, disabled) -->
              <path d="M260,283 C300,283 310,288 340,288" stroke="var(--color-border)" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
              <!-- To 长难句剖析 (chosen) -->
              <path d="M260,283 C300,283 310,318 340,318" stroke="var(--path-fork)" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>
              <!-- To 题意理解 (grayed) -->
              <path d="M260,283 C300,283 310,348 340,348" stroke="var(--color-border)" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>

              <!-- Branch node: 背单词 (already done) -->
              <g class="tree-node" opacity="0.45">
                <rect x="342" y="272" width="120" height="34" rx="8" fill="var(--color-bg)" stroke="var(--color-border)" stroke-width="1"/>
                <!-- Small done check -->
                <circle cx="362" cy="289" r="7" fill="var(--state-success-bg)"/>
                <path d="M359,289 L361,291 L365,287" stroke="var(--state-success)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="378" y="293" font-family="var(--font-family)" font-size="12" font-weight="500" fill="var(--color-text-tertiary)">背单词</text>
              </g>

              <!-- Branch node: 长难句剖析 (chosen, completed) -->
              <g class="tree-node">
                <rect x="342" y="302" width="120" height="34" rx="8" fill="var(--path-node-active)" stroke="var(--path-fork)" stroke-width="1.5"/>
                <circle cx="362" cy="319" r="9" fill="var(--state-success)"/>
                <path d="M358,319 L361,322 L367,316" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="378" y="323" font-family="var(--font-family)" font-size="12" font-weight="600" fill="var(--color-text-primary)">长难句剖析</text>
              </g>

              <!-- Branch node: 题意理解 (not chosen) -->
              <g class="tree-node" opacity="0.4">
                <rect x="342" y="332" width="120" height="34" rx="8" fill="var(--color-bg)" stroke="var(--color-border)" stroke-width="1"/>
                <text x="402" y="353" font-family="var(--font-family)" font-size="12" font-weight="500" fill="var(--color-text-tertiary)" text-anchor="middle">题意理解</text>
              </g>

              <!-- Return arrow from 长难句剖析 to Round 3 main node -->
              <path d="M402,336 C402,380 260,390 175,390" stroke="var(--path-return)" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
              <g transform="translate(298,368)">
                <rect x="0" y="0" width="36" height="16" rx="4" fill="var(--state-warning-bg)"/>
                <text x="18" y="12" font-family="var(--font-family)" font-size="9" font-weight="600" fill="var(--path-return)" text-anchor="middle">回归</text>
              </g>

              <!-- ============ ROUND 3 NODES ============ -->
              <!-- Main node: 阅读理解 (Round 3) - PASS 83% -->
              <g class="tree-node">
                <rect x="78" y="390" width="154" height="66" rx="10" fill="var(--state-success-bg)" stroke="var(--state-success)" stroke-width="2"/>
                <rect x="78" y="390" width="5" height="66" rx="2.5" fill="var(--state-success)"/>
                <circle cx="100" cy="408" r="10" fill="var(--state-success)"/>
                <!-- Star icon inside -->
                <path d="M96,408 L98,404 L100,408 L104,408 L101,411 L102,415 L100,413 L98,415 L99,411 L96,408 Z" fill="#fff" stroke="none"/>
                <text x="115" y="412" font-family="var(--font-family)" font-size="13" font-weight="700" fill="var(--state-success)">阅读理解</text>
                <rect x="94" y="420" width="48" height="20" rx="10" fill="rgba(52,199,123,0.15)"/>
                <text x="118" y="434" font-family="var(--font-family)" font-size="10" font-weight="700" fill="var(--state-success)" text-anchor="middle">83%</text>
                <rect x="148" y="420" width="56" height="20" rx="10" fill="rgba(52,199,123,0.15)"/>
                <text x="176" y="434" font-family="var(--font-family)" font-size="10" font-weight="700" fill="var(--state-success)" text-anchor="middle">通过</text>
              </g>

              <!-- LEVEL CLEAR celebration -->
              <g transform="translate(250, 408)">
                <rect x="0" y="-12" width="110" height="26" rx="13" fill="var(--state-success)" opacity="0.9"/>
                <text x="55" y="4" font-family="var(--font-family)" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">LEVEL CLEAR!</text>
                <!-- Sparkle accents -->
                <circle cx="-4" cy="-6" r="2" fill="var(--state-success)" opacity="0.5"/>
                <circle cx="114" cy="-6" r="2" fill="var(--state-success)" opacity="0.5"/>
                <circle cx="-2" cy="8" r="1.5" fill="var(--state-success)" opacity="0.35"/>
                <circle cx="112" cy="8" r="1.5" fill="var(--state-success)" opacity="0.35"/>
              </g>

              <!-- Decorative: subtle celebration dots near success -->
              <circle cx="155" cy="470" r="2.5" fill="var(--state-success)" opacity="0.3"/>
              <circle cx="165" cy="475" r="1.5" fill="var(--state-success)" opacity="0.2"/>
              <circle cx="145" cy="476" r="1.5" fill="var(--state-success)" opacity="0.2"/>

            </svg>
          </div>

          <!-- Legend -->
          <div class="flex items-center justify-center gap-6 mt-6 pt-5" style="border-top: 1px solid var(--color-border-light);">
            <div class="flex items-center gap-2">
              <span style="width: 24px; height: 2.5px; background: var(--path-main); border-radius: 2px; display: inline-block;"></span>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">主路径</span>
            </div>
            <div class="flex items-center gap-2">
              <span style="width: 24px; height: 2.5px; background: var(--path-fork); border-radius: 2px; display: inline-block;"></span>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">Fork 分支</span>
            </div>
            <div class="flex items-center gap-2">
              <span style="width: 24px; height: 0; border-top: 2.5px dashed var(--path-return); display: inline-block;"></span>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">回归</span>
            </div>
            <div class="flex items-center gap-2">
              <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--state-success); display: inline-block;"></span>
              <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">通过</span>
            </div>
